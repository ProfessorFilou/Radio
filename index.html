<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Radio Garden</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --bg: #0a0a0c;
      --panel: #121214;
      --card: #1c1c1e;
      --text: #f5f5f7;
      --muted: #8e8e93;
      --accent: #0a84ff;
      --player-bg: #ffffff;
      --player-text: #1c1c1e;
      --radius: 16px;
      --shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      display: grid;
      grid-template-columns: 1fr 380px;
      height: 100vh;
      height: 100dvh;
    }

    /* —— MAP —— */
    #map {
      width: 100%;
      height: 100%;
      background: #0a0a0c;
      z-index: 1;
    }

    .leaflet-container {
      background: #0a0a0c;
      font: inherit;
    }

    .leaflet-control-zoom {
      border: none !important;
      box-shadow: var(--shadow) !important;
      border-radius: 12px !important;
      overflow: hidden;
    }
    .leaflet-control-zoom a {
      background: var(--card) !important;
      color: var(--text) !important;
      border: none !important;
      width: 36px !important;
      height: 36px !important;
      line-height: 36px !important;
      font-size: 18px !important;
    }
    .leaflet-control-zoom a:hover {
      background: #2c2c2e !important;
    }

    .station-marker {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid #fff;
      box-shadow: 0 0 0 3px rgba(10,132,255,0.35), 0 2px 8px rgba(0,0,0,0.5);
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .station-marker:hover,
    .station-marker.active {
      transform: scale(1.45);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(10,132,255,0.6), 0 4px 12px rgba(0,0,0,0.6);
    }

    /* —— SIDEBAR —— */
    .sidebar {
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border-left: 1px solid rgba(255,255,255,0.06);
      height: 100%;
      position: relative;
      z-index: 10;
    }

    .sidebar-header {
      padding: 20px 20px 12px;
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }
    .logo-icon {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: linear-gradient(135deg, #0a84ff, #5e5ce6);
      display: grid;
      place-items: center;
      font-size: 16px;
    }
    .logo h1 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    /* Apple-style search */
    .search-wrap {
      position: relative;
    }
    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      opacity: 0.5;
      pointer-events: none;
    }
    .search-input {
      width: 100%;
      height: 44px;
      border: none;
      border-radius: 12px;
      background: var(--card);
      color: var(--text);
      font-size: 16px;
      padding: 0 16px 0 42px;
      outline: none;
      transition: background 0.2s, box-shadow 0.2s;
      -webkit-appearance: none;
    }
    .search-input::placeholder {
      color: var(--muted);
    }
    .search-input:focus {
      background: #2c2c2e;
      box-shadow: 0 0 0 3px rgba(10,132,255,0.35);
    }

    .results {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px 100px;
      -webkit-overflow-scrolling: touch;
    }
    .results::-webkit-scrollbar {
      width: 6px;
    }
    .results::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.15);
      border-radius: 3px;
    }

    .section-label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--muted);
      padding: 12px 8px 6px;
    }

    .station-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 10px;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .station-item:hover {
      background: rgba(255,255,255,0.06);
    }
    .station-item.playing {
      background: rgba(10,132,255,0.12);
    }

    .station-fav {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: var(--card);
      object-fit: cover;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      font-size: 18px;
      overflow: hidden;
    }
    .station-fav img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .station-meta {
      flex: 1;
      min-width: 0;
    }
    .station-name {
      font-size: 15px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .station-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    /* —— PLAYER (Spotify white) —— */
    .player {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--player-bg);
      color: var(--player-text);
      padding: 14px 16px 18px;
      border-radius: 20px 20px 0 0;
      box-shadow: 0 -8px 40px rgba(0,0,0,0.25);
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 20;
      transform: translateY(110%);
      transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .player.visible {
      transform: translateY(0);
    }

    .player-top {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .player-cover {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      background: #e5e5ea;
      overflow: hidden;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      font-size: 22px;
    }
    .player-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .player-info {
      flex: 1;
      min-width: 0;
    }
    .player-title {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .player-artist {
      font-size: 13px;
      color: #636366;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
    }

    .ctrl-btn {
      width: 44px;
      height: 44px;
      border: none;
      background: transparent;
      border-radius: 50%;
      display: grid;
      place-items: center;
      cursor: pointer;
      color: var(--player-text);
      transition: background 0.15s, transform 0.1s;
    }
    .ctrl-btn:hover {
      background: rgba(0,0,0,0.06);
    }
    .ctrl-btn:active {
      transform: scale(0.92);
    }
    .ctrl-btn.play {
      width: 56px;
      height: 56px;
      background: #1c1c1e;
      color: #fff;
    }
    .ctrl-btn.play:hover {
      background: #2c2c2e;
    }
    .ctrl-btn svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }
    .ctrl-btn.play svg {
      width: 26px;
      height: 26px;
    }

    .status-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #34c759;
      margin-right: 6px;
      animation: pulse 1.6s ease infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Loading */
    .loading-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 2px;
      background: var(--accent);
      width: 0;
      transition: width 0.3s;
      z-index: 100;
    }

    /* Mobile */
    @media (max-width: 800px) {
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr auto;
      }
      .sidebar {
        border-left: none;
        border-top: 1px solid rgba(255,255,255,0.06);
        height: 48vh;
        max-height: 420px;
      }
      #map {
        height: 52vh;
      }
    }
  </style>
</head>
<body>
  <div class="loading-bar" id="loadingBar"></div>
  <div class="app">
    <div id="map"></div>

    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <div class="logo-icon">🌍</div>
          <h1>Radio Garden</h1>
        </div>
        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <circle cx="11" cy="11" r="7"/>
            <path d="M20 20l-3.5-3.5"/>
          </svg>
          <input
            type="search"
            class="search-input"
            id="searchInput"
            placeholder="Radiosender suchen…"
            autocomplete="off"
            spellcheck="false"
          />
        </div>
      </div>

      <div class="results" id="results">
        <div class="empty-state">
          Lade Sender mit Koordinaten…<br>
          Klicke auf einen Punkt auf der Karte<br>oder suche nach Namen.
        </div>
      </div>

      <!-- Spotify-style white player -->
      <div class="player" id="player">
        <div class="player-top">
          <div class="player-cover" id="playerCover">📻</div>
          <div class="player-info">
            <div class="player-title" id="playerTitle">—</div>
            <div class="player-artist" id="playerArtist">
              <span class="status-dot" id="liveDot" style="display:none"></span>
              <span id="playerSub">Bereit</span>
            </div>
          </div>
        </div>
        <div class="player-controls">
          <button class="ctrl-btn" id="btnPrev" title="Vorheriger" aria-label="Vorheriger">
            <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          </button>
          <button class="ctrl-btn play" id="btnPlay" title="Play / Pause" aria-label="Play">
            <svg id="iconPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg id="iconPause" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>
          <button class="ctrl-btn" id="btnNext" title="Nächster" aria-label="Nächster">
            <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zm-11 6l8.5 6V6z"/></svg>
          </button>
        </div>
      </div>
    </aside>
  </div>

  <audio id="audio" preload="none" crossorigin="anonymous"></audio>

  <script>
    const API = 'https://de1.api.radio-browser.info/json';
    const UA = 'RadioGardenClone/1.0';

    // State
    let map, markersLayer;
    let allStations = [];       // stations currently on map
    let searchResults = [];
    let currentStation = null;
    let currentList = [];       // for prev/next
    let isPlaying = false;
    let searchTimeout = null;

    const audio = document.getElementById('audio');
    const playerEl = document.getElementById('player');
    const loadingBar = document.getElementById('loadingBar');

    // ——— Helpers ———
    function setLoading(pct) {
      loadingBar.style.width = pct + '%';
      if (pct >= 100) setTimeout(() => { loadingBar.style.width = '0'; }, 400);
    }

    async function api(path, params = {}) {
      const qs = new URLSearchParams(params).toString();
      const url = `${API}${path}${qs ? '?' + qs : ''}`;
      const res = await fetch(url, {
        headers: { 'User-Agent': UA, 'Accept': 'application/json' }
      });
      if (!res.ok) throw new Error('API ' + res.status);
      return res.json();
    }

    function faviconHtml(s) {
      if (s.favicon && s.favicon.startsWith('http')) {
        return `<img src="${s.favicon}" alt="" onerror="this.parentElement.textContent='📻'" />`;
      }
      return '📻';
    }

    function stationSubtitle(s) {
      const parts = [];
      if (s.country) parts.push(s.country);
      if (s.tags) {
        const t = s.tags.split(',').slice(0, 2).join(', ');
        if (t) parts.push(t);
      }
      return parts.join(' · ') || 'Internet Radio';
    }

    // ——— Map ———
    function initMap() {
      map = L.map('map', {
        zoomControl: true,
        attributionControl: false,
        worldCopyJump: true,
        minZoom: 2,
        maxZoom: 12
      }).setView([20, 10], 2.5);

      // Dark, clean tiles (CartoDB Dark Matter)
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        subdomains: 'abcd',
        maxZoom: 19
      }).addTo(map);

      markersLayer = L.layerGroup().addTo(map);

      // Subtle globe-ish feel: restrict a bit
      map.setMaxBounds([[-85, -180], [85, 180]]);
    }

    function clearMarkers() {
      markersLayer.clearLayers();
    }

    function addMarker(station) {
      if (!station.geo_lat || !station.geo_long) return;

      const icon = L.divIcon({
        className: '',
        html: `<div class="station-marker" data-uuid="${station.stationuuid}"></div>`,
        iconSize: [14, 14],
        iconAnchor: [7, 7]
      });

      const m = L.marker([station.geo_lat, station.geo_long], { icon });
      m.station = station;
      m.on('click', () => playStation(station, allStations));
      markersLayer.addLayer(m);
    }

    function highlightMarker(uuid) {
      document.querySelectorAll('.station-marker').forEach(el => {
        el.classList.toggle('active', el.dataset.uuid === uuid);
      });
    }

    // ——— Load initial stations for map ———
    async function loadMapStations() {
      setLoading(30);
      try {
        // Popular stations with geo + some random high-vote ones
        const stations = await api('/stations/search', {
          has_geo_info: true,
          hidebroken: true,
          order: 'votes',
          reverse: true,
          limit: 800
        });
        allStations = stations.filter(s => s.geo_lat && s.geo_long && s.url_resolved);
        clearMarkers();
        allStations.forEach(addMarker);
        renderList(allStations.slice(0, 40), 'Beliebte Sender');
        setLoading(100);
      } catch (e) {
        console.error(e);
        document.getElementById('results').innerHTML =
          `<div class="empty-state">Konnte Sender nicht laden.<br>Prüfe die Verbindung.</div>`;
        setLoading(100);
      }
    }

    // ——— Search ———
    async function doSearch(q) {
      q = q.trim();
      if (!q) {
        renderList(allStations.slice(0, 40), 'Beliebte Sender');
        return;
      }
      setLoading(40);
      try {
        const stations = await api('/stations/search', {
          name: q,
          hidebroken: true,
          order: 'votes',
          reverse: true,
          limit: 60
        });
        searchResults = stations.filter(s => s.url_resolved);
        renderList(searchResults, `Ergebnisse für „${q}“`);
        setLoading(100);
      } catch (e) {
        console.error(e);
        setLoading(100);
      }
    }

    function renderList(stations, label) {
      const el = document.getElementById('results');
      if (!stations.length) {
        el.innerHTML = `<div class="empty-state">Keine Sender gefunden.</div>`;
        return;
      }
      let html = `<div class="section-label">${label}</div>`;
      stations.forEach(s => {
        const playing = currentStation && currentStation.stationuuid === s.stationuuid;
        html += `
          <div class="station-item ${playing ? 'playing' : ''}" data-uuid="${s.stationuuid}">
            <div class="station-fav">${faviconHtml(s)}</div>
            <div class="station-meta">
              <div class="station-name">${escapeHtml(s.name)}</div>
              <div class="station-sub">${escapeHtml(stationSubtitle(s))}</div>
            </div>
          </div>`;
      });
      el.innerHTML = html;

      el.querySelectorAll('.station-item').forEach(item => {
        item.addEventListener('click', () => {
          const s = stations.find(x => x.stationuuid === item.dataset.uuid);
          if (s) playStation(s, stations);
        });
      });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ——— Player ———
    function playStation(station, list = null) {
      if (list) currentList = list;
      currentStation = station;

      // UI
      playerEl.classList.add('visible');
      document.getElementById('playerTitle').textContent = station.name || 'Unbekannt';
      document.getElementById('playerSub').textContent = stationSubtitle(station);
      document.getElementById('liveDot').style.display = 'none';

      const cover = document.getElementById('playerCover');
      if (station.favicon && station.favicon.startsWith('http')) {
        cover.innerHTML = `<img src="${station.favicon}" alt="" onerror="this.parentElement.textContent='📻'" />`;
      } else {
        cover.textContent = '📻';
      }

      highlightMarker(station.stationuuid);
      renderList(
        document.getElementById('searchInput').value.trim()
          ? searchResults
          : allStations.slice(0, 40),
        document.getElementById('searchInput').value.trim()
          ? `Ergebnisse für „${document.getElementById('searchInput').value.trim()}“`
          : 'Beliebte Sender'
      );

      // Fly to marker if geo
      if (station.geo_lat && station.geo_long) {
        map.flyTo([station.geo_lat, station.geo_long], Math.max(map.getZoom(), 5), {
          duration: 1.2
        });
      }

      // Stream
      const url = station.url_resolved || station.url;
      audio.src = url;
      audio.play().then(() => {
        isPlaying = true;
        updatePlayIcon();
        document.getElementById('liveDot').style.display = 'inline-block';
        document.getElementById('playerSub').textContent = stationSubtitle(station);
      }).catch(err => {
        console.warn('Play failed', err);
        document.getElementById('playerSub').textContent = 'Stream nicht erreichbar';
        isPlaying = false;
        updatePlayIcon();
      });

      // Register click (optional, non-blocking)
      try {
        fetch(`${API}/url/${station.stationuuid}`, {
          headers: { 'User-Agent': UA }
        }).catch(() => {});
      } catch (_) {}
    }

    function togglePlay() {
      if (!currentStation) return;
      if (isPlaying) {
        audio.pause();
        isPlaying = false;
        document.getElementById('liveDot').style.display = 'none';
      } else {
        audio.play().then(() => {
          isPlaying = true;
          document.getElementById('liveDot').style.display = 'inline-block';
        }).catch(() => {});
      }
      updatePlayIcon();
    }

    function updatePlayIcon() {
      document.getElementById('iconPlay').style.display = isPlaying ? 'none' : 'block';
      document.getElementById('iconPause').style.display = isPlaying ? 'block' : 'none';
    }

    function playRelative(delta) {
      if (!currentList.length || !currentStation) return;
      const idx = currentList.findIndex(s => s.stationuuid === currentStation.stationuuid);
      if (idx === -1) return;
      const next = currentList[(idx + delta + currentList.length) % currentList.length];
      playStation(next, currentList);
    }

    // ——— Events ———
    document.getElementById('searchInput').addEventListener('input', (e) => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => doSearch(e.target.value), 320);
    });

    document.getElementById('btnPlay').addEventListener('click', togglePlay);
    document.getElementById('btnPrev').addEventListener('click', () => playRelative(-1));
    document.getElementById('btnNext').addEventListener('click', () => playRelative(1));

    audio.addEventListener('playing', () => {
      isPlaying = true;
      updatePlayIcon();
      document.getElementById('liveDot').style.display = 'inline-block';
    });
    audio.addEventListener('pause', () => {
      isPlaying = false;
      updatePlayIcon();
      document.getElementById('liveDot').style.display = 'none';
    });
    audio.addEventListener('error', () => {
      document.getElementById('playerSub').textContent = 'Stream-Fehler';
      isPlaying = false;
      updatePlayIcon();
    });

    // Keyboard
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (e.code === 'Space') {
        e.preventDefault();
        togglePlay();
      }
    });

    // ——— Start ———
    initMap();
    loadMapStations();
  </script>
</body>
</html>
